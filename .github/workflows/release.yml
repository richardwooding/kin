name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release and upload archives
  packages: write # push the ko-built image to ghcr.io
  id-token: write # OIDC, used by ko's SBOM attachment

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags for the changelog and version
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # stdlib-only module, no go.sum to key a cache on
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with contents:write on richardwooding/homebrew-tap so the cask
          # can be pushed cross-repo (the default GITHUB_TOKEN cannot).
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
